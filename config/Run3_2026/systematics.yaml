scales:
  - up
  - down

qcd_scale:
  enabled: true
  name: "QCDscale_{process}"
  branch: "LHEScaleWeight"
  prescription: "six_point_bin_envelope"
  missing_branch: "unity"
  missing_sums: "skip"
  points:
    - {name: "muR0p5_muF0p5", index: 0}
    - {name: "muR0p5_muF1", index: 1}
    - {name: "muR1_muF0p5", index: 3}
    - {name: "muR1_muF2", index: 5}
    - {name: "muR2_muF1", index: 7}
    - {name: "muR2_muF2", index: 8}

derived_systematics:
  EWKHerwigPythia:
    name: "CMS_hmm_EWKZ_partonShower"
    nominal_process: "EWK_2Mu2J_MLL_105to160_herwig"
    alternative_process: "EWK_2Mu2J_MLL_105to160_pythia"
    coefficient: 0.5
    floor: 0.0

pdf:
  enabled: true
  branch: "LHEPdfWeight"
  prescription: "replicas_rms"
  nominal_index: 0
  replica_start: 1
  replica_count: 100
  missing_branch: "unity"

systematics:
  Central:
    muon_suffix: ""
    jet_suffix: ""
    weight: "weight__Central"

  JER:
    muon_suffix: ""
    jet_suffix: "_JER{scale}"
    weight: "weight__Central"
    name: "CMS_res_j_{era}"

  JES_Total:
    muon_suffix: ""
    jet_suffix: "_JESTotal{scale}"
    weight: "weight__Central"
    name: "CMS_scale_j_{era}"

  MuonScale:
    jet_suffix: ""
    muon_suffix: "_FSR_scale_{scale}"
    weight: "weight__Central"
    name: "CMS_scale_m_{era}"

  MuonRes:
    jet_suffix: ""
    muon_suffix: "_FSR_res_{scale}"
    weight: "weight__Central"
    name: "CMS_res_m_{era}"

  # PU:
  #   jet_suffix: ""
  #   muon_suffix: ""
  #   weight: "weight_PU_{scale}"
  #   name: "CMS_pileup_{era}"

  # MuonID:
  #   jet_suffix: ""
  #   muon_suffix: ""
  #   weight: "weight__MuonID_{scale}"
  #   name: "CMS_eff_m_id_{era}"
  # MuonIso:
  #   jet_suffix: ""
  #   muon_suffix: ""
  #   weight: "weight__MuonIso_{scale}"
  #   name: "CMS_eff_m_iso_{era}"

  # singleMuTrigger:
  #   jet_suffix: ""
  #   muon_suffix: ""
  #   weight: "weight__singleMuTrigger_{scale}"
  #   name: "CMS_eff_m_trigger_{era}"

weights:
  Central:
    expression: >
      weight_gen *
      weight_lumi *
      weight_xs *
      weight_pu *
      weight_mu1_LoosePFIso_MediumID_Central *
      weight_mu1_MediumID_Trk_Central *
      weight_mu2_LoosePFIso_MediumID_Central *
      weight_mu2_MediumID_Trk_Central *
      weight_TrgSF_singleMu_IsoMu24Central

  # QCD renormalization/factorization scales: unnormalized 6-point envelope.
  QCDScale_{scale}:
    jet_suffix: ""
    muon_suffix: ""
    name: "QCDscale_{process}"
    weight: "weight__QCDScale_{scale}"
    derived_envelope: true

  # PDF replica RMS; alphaS weights are intentionally excluded.
  PDF_{scale}:
    jet_suffix: ""
    muon_suffix: ""
    name: "pdf_{process}"
    weight: "weight__PDF_{scale}"
    relative_expression: "weight_pdf_{scale}"

  # ========================================
  # Pileup
  # ========================================

  PU_up:
    jet_suffix: ""
    muon_suffix: ""
    name: "CMS_pileup_{era}"
    weight: "weight__PU_up"
    expression: >
      weight_gen *
      weight_lumi *
      weight_xs *
      weight_pu_up *
      weight_mu1_LoosePFIso_MediumID_Central *
      weight_mu1_MediumID_Trk_Central *
      weight_mu2_LoosePFIso_MediumID_Central *
      weight_mu2_MediumID_Trk_Central *
      weight_TrgSF_singleMu_IsoMu24Central

  PU_down:
    jet_suffix: ""
    muon_suffix: ""
    name: "CMS_pileup_{era}"
    weight: "weight__PU_down"
    expression: >
      weight_gen *
      weight_lumi *
      weight_xs *
      weight_pu_down *
      weight_mu1_LoosePFIso_MediumID_Central *
      weight_mu1_MediumID_Trk_Central *
      weight_mu2_LoosePFIso_MediumID_Central *
      weight_mu2_MediumID_Trk_Central *
      weight_TrgSF_singleMu_IsoMu24Central

  # ========================================
  # Muon ID/Iso
  # ========================================

  MuonID_up:
    jet_suffix: ""
    muon_suffix: ""
    name: "CMS_eff_m_id_{era}"
    weight: "weight__MuonID_up"
    expression: >
      weight_gen *
      weight_lumi *
      weight_xs *
      weight_pu *
      weight_mu1_LoosePFIso_MediumID_Central *
      weight_mu1_MediumID_Trk_up *
      weight_mu2_LoosePFIso_MediumID_Central *
      weight_mu2_MediumID_Trk_up *
      weight_TrgSF_singleMu_IsoMu24Central

  MuonID_down:
    jet_suffix: ""
    muon_suffix: ""
    name: "CMS_eff_m_id_{era}"
    weight: "weight__MuonID_down"
    expression: >
      weight_gen *
      weight_lumi *
      weight_xs *
      weight_pu *
      weight_mu1_LoosePFIso_MediumID_Central *
      weight_mu1_MediumID_Trk_down *
      weight_mu2_LoosePFIso_MediumID_Central *
      weight_mu2_MediumID_Trk_down *
      weight_TrgSF_singleMu_IsoMu24Central

  MuonIso_up:
    jet_suffix: ""
    muon_suffix: ""
    name: "CMS_eff_m_iso_{era}"
    weight: "weight__MuonIso_up"
    expression: >
      weight_gen *
      weight_lumi *
      weight_xs *
      weight_pu *
      weight_mu1_LoosePFIso_MediumID_up *
      weight_mu1_MediumID_Trk_Central *
      weight_mu2_LoosePFIso_MediumID_up *
      weight_mu2_MediumID_Trk_Central *
      weight_TrgSF_singleMu_IsoMu24Central

  MuonIso_down:
    jet_suffix: ""
    muon_suffix: ""
    name: "CMS_eff_m_iso_{era}"
    weight: "weight__MuonIso_down"
    expression: >
      weight_gen *
      weight_lumi *
      weight_xs *
      weight_pu *
      weight_mu1_LoosePFIso_MediumID_down *
      weight_mu1_MediumID_Trk_Central *
      weight_mu2_LoosePFIso_MediumID_down *
      weight_mu2_MediumID_Trk_Central *
      weight_TrgSF_singleMu_IsoMu24Central

  # ========================================
  # Trigger
  # ========================================

  singleMuTrigger_up:
    jet_suffix: ""
    muon_suffix: ""
    name: "CMS_eff_m_trigger_{era}"
    weight: "weight__singleMuTrigger_up"
    expression: >
      weight_gen *
      weight_lumi *
      weight_xs *
      weight_pu *
      weight_mu1_LoosePFIso_MediumID_Central *
      weight_mu1_MediumID_Trk_Central *
      weight_mu2_LoosePFIso_MediumID_Central *
      weight_mu2_MediumID_Trk_Central *
      weight_TrgSF_singleMu_IsoMu24up

  singleMuTrigger_down:
    jet_suffix: ""
    muon_suffix: ""
    name: "CMS_eff_m_trigger_{era}"
    weight: "weight__singleMuTrigger_down"
    expression: >
      weight_gen *
      weight_lumi *
      weight_xs *
      weight_pu *
      weight_mu1_LoosePFIso_MediumID_Central *
      weight_mu1_MediumID_Trk_Central *
      weight_mu2_LoosePFIso_MediumID_Central *
      weight_mu2_MediumID_Trk_Central *
      weight_TrgSF_singleMu_IsoMu24down
