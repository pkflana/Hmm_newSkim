weights:
  Central:
    # Temporary 2026 prescription: the current DY skims do not contain the
    # muon ID/isolation/trigger scale-factor columns.
    expression: >
      genWeight *
      weight_lumi *
      weight_xs *
      weight_pu

  # QCD renormalization/factorization scales: unnormalized 6-point envelope.
  QCDScale_{scale}:
    jet_suffix: ""
    muon_suffix: ""
    name: "QCDscale_{process}"
    isCorrelated: true
    Eras_correlated: all
    weight: "weight__QCDScale_{scale}"
    derived_envelope: true

  # PDF replica RMS; alphaS weights are intentionally excluded.
  PDF_{scale}:
    jet_suffix: ""
    muon_suffix: ""
    name: "pdf_{pdf_process}"
    isCorrelated: true
    Eras_correlated: all
    weight: "weight__PDF_{scale}"
    relative_expression: "weight_pdf_{scale}"

  # ========================================
  # Pileup
  # ========================================

  PU_up:
    jet_suffix: ""
    muon_suffix: ""
    name: "CMS_pileup_{era}"
    isCorrelated: false
    weight: "weight__PU_up"
    expression: >
      genWeight *
      weight_lumi *
      weight_xs *
      weight_pu_up

  PU_down:
    jet_suffix: ""
    muon_suffix: ""
    name: "CMS_pileup_{era}"
    isCorrelated: false
    weight: "weight__PU_down"
    expression: >
      genWeight *
      weight_lumi *
      weight_xs *
      weight_pu_down

  # ========================================
  # Muon ID/Iso
  # ========================================

  MuonID_up:
    jet_suffix: ""
    muon_suffix: ""
    name: "CMS_eff_m_id_{era}"
    isCorrelated: false
    weight: "weight__MuonID_up"
    expression: >
      genWeight *
      weight_lumi *
      weight_xs *
      weight_pu

  MuonID_down:
    jet_suffix: ""
    muon_suffix: ""
    name: "CMS_eff_m_id_{era}"
    isCorrelated: false
    weight: "weight__MuonID_down"
    expression: >
      genWeight *
      weight_lumi *
      weight_xs *
      weight_pu

  MuonIso_up:
    jet_suffix: ""
    muon_suffix: ""
    name: "CMS_eff_m_iso_{era}"
    isCorrelated: false
    weight: "weight__MuonIso_up"
    expression: >
      genWeight *
      weight_lumi *
      weight_xs *
      weight_pu

  MuonIso_down:
    jet_suffix: ""
    muon_suffix: ""
    name: "CMS_eff_m_iso_{era}"
    isCorrelated: false
    weight: "weight__MuonIso_down"
    expression: >
      genWeight *
      weight_lumi *
      weight_xs *
      weight_pu

  # ========================================
  # Trigger
  # ========================================

  singleMuTrigger_up:
    jet_suffix: ""
    muon_suffix: ""
    name: "CMS_eff_m_trigger_{era}"
    isCorrelated: false
    weight: "weight__singleMuTrigger_up"
    expression: >
      genWeight *
      weight_lumi *
      weight_xs *
      weight_pu

  singleMuTrigger_down:
