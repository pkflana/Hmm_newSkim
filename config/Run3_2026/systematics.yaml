  #   weight: "weight__singleMuTrigger_{scale}"
  #   name: "CMS_eff_m_trigger_{era}"

weights:
  Central:
    expression: >
      weight_gen *
      weight_lumi *
      weight_xs *
      weight_pu *
      weight_mu1_LoosePFIso_MediumID_Central *
      weight_mu1_MediumID_Trk_Central *
      weight_mu2_LoosePFIso_MediumID_Central *
      weight_mu2_MediumID_Trk_Central *
      weight_TrgSF_singleMu_IsoMu24Central

  # QCD renormalization/factorization scales: unnormalized 6-point envelope.
  QCDScale_{scale}:
    jet_suffix: ""
    muon_suffix: ""
    name: "QCDscale_{process}"
    weight: "weight__QCDScale_{scale}"
    derived_envelope: true

  # PDF replica RMS; alphaS weights are intentionally excluded.
  PDF_{scale}:
    jet_suffix: ""
    muon_suffix: ""
    name: "pdf_{pdf_process}"
    weight: "weight__PDF_{scale}"
    relative_expression: "weight_pdf_{scale}"

  # ========================================
  # Pileup
  # ========================================

  PU_up:
    jet_suffix: ""
    muon_suffix: ""
    name: "CMS_pileup_{era}"
    weight: "weight__PU_up"
    expression: >
      weight_gen *
      weight_lumi *
      weight_xs *
      weight_pu_up *
      weight_mu1_LoosePFIso_MediumID_Central *
      weight_mu1_MediumID_Trk_Central *
      weight_mu2_LoosePFIso_MediumID_Central *
      weight_mu2_MediumID_Trk_Central *
      weight_TrgSF_singleMu_IsoMu24Central

  PU_down:
    jet_suffix: ""
    muon_suffix: ""
    name: "CMS_pileup_{era}"
    weight: "weight__PU_down"
    expression: >
      weight_gen *
      weight_lumi *
      weight_xs *
      weight_pu_down *
      weight_mu1_LoosePFIso_MediumID_Central *
      weight_mu1_MediumID_Trk_Central *
      weight_mu2_LoosePFIso_MediumID_Central *
      weight_mu2_MediumID_Trk_Central *
      weight_TrgSF_singleMu_IsoMu24Central

  # ========================================
  # Muon ID/Iso
  # ========================================

  MuonID_up:
    jet_suffix: ""
    muon_suffix: ""
    name: "CMS_eff_m_id_{era}"
    weight: "weight__MuonID_up"
    expression: >
      weight_gen *
      weight_lumi *
      weight_xs *
      weight_pu *
      weight_mu1_LoosePFIso_MediumID_Central *
      weight_mu1_MediumID_Trk_up *
      weight_mu2_LoosePFIso_MediumID_Central *
      weight_mu2_MediumID_Trk_up *
      weight_TrgSF_singleMu_IsoMu24Central

  MuonID_down:
    jet_suffix: ""
    muon_suffix: ""
    name: "CMS_eff_m_id_{era}"
    weight: "weight__MuonID_down"
    expression: >
      weight_gen *
      weight_lumi *
      weight_xs *
      weight_pu *
      weight_mu1_LoosePFIso_MediumID_Central *
      weight_mu1_MediumID_Trk_down *
      weight_mu2_LoosePFIso_MediumID_Central *
      weight_mu2_MediumID_Trk_down *
      weight_TrgSF_singleMu_IsoMu24Central

  MuonIso_up:
    jet_suffix: ""
    muon_suffix: ""
    name: "CMS_eff_m_iso_{era}"
    weight: "weight__MuonIso_up"
    expression: >
      weight_gen *
      weight_lumi *
      weight_xs *
      weight_pu *
      weight_mu1_LoosePFIso_MediumID_up *
      weight_mu1_MediumID_Trk_Central *
      weight_mu2_LoosePFIso_MediumID_up *
      weight_mu2_MediumID_Trk_Central *
      weight_TrgSF_singleMu_IsoMu24Central

  MuonIso_down:
    jet_suffix: ""
    muon_suffix: ""
    name: "CMS_eff_m_iso_{era}"
    weight: "weight__MuonIso_down"
    expression: >
      weight_gen *
      weight_lumi *
      weight_xs *
      weight_pu *
