scales:
  - up
  - down

qcd_scale:
  isCorrelated: true
  Eras_correlated: all
  enabled: true
  name: "QCDscale_{process}"
  branch: "LHEScaleWeight"
  prescription: "six_point_bin_envelope"
  missing_branch: "unity"
  missing_sums: "skip"
  process_labels:
    DY: "V"
    DYto2Mu_MLL105To160: "V"
    DYto2Mu_MLL105To160_nonStitched: "V"
    DYto2Mu_MLL105To160_VBFFiltered: "V"
    DYto2Mu_MLL105To160_VBFFiltered_nonStitched: "V"
    DYto2Mu_MLL105To160_FlashSim: "V"
    DYto2Mu_FlashSim: "V"
    DYto2L_FlashSim: "V"
    DYto2Mu_minnlo: "V"
    W: "V"
    W_NJets: "V"
    TT: "ttbar"
    TTto2L2Nu_Flashsim: "ttbar"
    ST: "ttbar"
    TW: "ttbar"
    TTX: "ttbar"
    EWK: "V"
    EWK_2Mu2J_MLL_105to160_herwig: "V"
    EWK_2Mu2J_MLL_105to160_pythia: "V"
    EWK_2Mu2J_MLL_105to160_pythia_Flashsim: "V"
    VV: "VV"
    VV_Inclusive: "VV"
    VVV: "VVV"
    VBFHto2Mu_M125_amcatnlo: "qqH"
    VBFHto2Mu_M125_powheg: "qqH"
    VBFHto2Mu_m125_Flashsim: "qqH"
    VBFHto2Mu_m120: "qqH"
    VBFHto2Mu_m130: "qqH"
    VBFHto2Mu_m125_tuneDown: "qqH"
    VBFHto2Mu_m125_tuneUp: "qqH"
    GluGluHto2Mu: "ggH"
    GluGluHto2Mu_amcatnlo: "ggH"
    GluGluHto2Mu_MiNNLO: "ggH"
    GluGluHto2Mu_tuneDown: "ggH"
    GluGluHto2Mu_tuneUp: "ggH"
    GluGluHto2Mu_M120: "ggH"
    GluGluHto2Mu_M130: "ggH"
    GluGluHto2Mu_powheg: "ggH"
    VHto2Mu: "VH"
    VH_inclusive: "VH"
    TTHto2Mu: "ttH"
    TTH_inclusive: "ttH"
    SingleH: "VH"
  variations:
    - {name: "QCD_ren_scale_{process}", down: "muR0p5_muF1", up: "muR2_muF1"}
    - {name: "QCD_fac_scale_{process}", down: "muR1_muF0p5", up: "muR1_muF2"}
  points:
    - {name: "muR0p5_muF0p5", index: 0}
    - {name: "muR0p5_muF1", index: 1}
    - {name: "muR1_muF0p5", index: 3}
    - {name: "muR1_muF2", index: 5}
    - {name: "muR2_muF1", index: 7}
    - {name: "muR2_muF2", index: 8}

derived_systematics:
  EWKHerwigPythia:
    name: "CMS_hmm_EWKZ_partonShower"
    isCorrelated: true
    Eras_correlated: all
    nominal_process: "EWK_2Mu2J_MLL_105to160_herwig"
    alternative_process: "EWK_2Mu2J_MLL_105to160_pythia"
    coefficient: 0.5
    floor: 0.0

