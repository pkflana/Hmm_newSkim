
submit: true
job_flavour: microcentury

chunk_size: 1        # files per job
target_chunk_size_gb: 5.0
max_files_per_chunk: 5
max_files: -1        # -1 = all files
use_ext: false     # if true, use all nanoAOD paths in each list; otherwise only the first

output_dir: /eos/cms/store/group/phys_higgs/cmshmm/vdamante/skim_v3/
histogram_output_dir: /eos/user/v/vdamante/H_mumu/Hists_DNN_erabased
histogram_systematics_output_dir: /eos/user/v/vdamante/H_mumu/Hists_DNN_erabased_systematics

# ---------------------------------------------------------
# condor configuration
# ---------------------------------------------------------

request_cpus: 1
request_memory: 4GB
request_disk: 2GB

# ---------------------------------------------------------
# optional controls
# ---------------------------------------------------------

# run only subset of datasets (optional override)
datasets_whitelist: []

# debug mode
dryrun: false


process_to_select:
  - Data_Muon
  - DY
  - DYto2Mu_MLL105To160
  - DYto2Mu_MLL105To160_combined
  - TT
  - W_NJets
  - EWK
  - EWK_2Mu2J_MLL_105to160_herwig
  - EWK_2Mu2J_MLL_105to160_pythia
  - SingleH
  - VV
  - VVV
  - ST
  - TW
  - TTX
  - VBFHto2Mu_M125_amcatnlo
  - VBFHto2Mu_M125_powheg
  - VBFHto2Mu_m120
  - VBFHto2Mu_m130
  - VBFHto2Mu_m125_tuneDown
  - VBFHto2Mu_m125_tuneUp
  - GluGluHto2Mu
  - GluGluHto2Mu_tuneDown
  - GluGluHto2Mu_tuneUp
  - GluGluHto2Mu_amcatnlo
  - GluGluHto2Mu_MiNNLO
  - GluGluHto2Mu
  - GluGluHto2Mu_M120
  - GluGluHto2Mu_M130


proxy_location: /afs/cern.ch/work/v/vdamante/Hmm_newSkim/data/voms.proxy
