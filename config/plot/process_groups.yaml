# Common plotting groups and colors for all eras.
#
# The process names listed here are the ROOT filenames without ".root" after
# hadd_hists_to_processes.py, and the keys in config/<era>/process_names.yaml.

process_scales: {}
# DY amc@nlo normalization is applied in histograms/hist_maker.py.
# Keeping it here as well would double-count it.

background_groups:
  DY_amcatnlo:
    name: "DY - amc@nlo"
    color_mplhep: dodgerblue
    processes:
      - DY
      - DY_ptll
      - DY_weighted

  DY_minnlo:
    name: "DY - MiNNLO"
    color_mplhep: dodgerblue
    processes:
      - DYto2Mu_minnlo
      - DYto2Mu_minnlo_weighted


  DYto2Mu_MLL105_160:
    name: "DY - MLL(105-160)"
    color_mplhep: dodgerblue
    processes:
      - DYto2Mu_MLL105To160
      - DYto2Mu_MLL_105To160
      - DYto2Mu_MLL105To160_ptll
      - DYto2Mu_MLL_105To160_ptll
      - DYto2Mu_MLL_105to160_amcatnloFXFX
      - DYto2Mu_MLL_105to160_amcatnloFXFX_stitched
      - DYto2Mu_MLL105To160_weighted
      - DYto2Mu_MLL_105to160_weighted
      - DYto2Mu_MLL_105to160_amcatnloFXFX_weighted
      - DYto2Mu_MLL_105to160_amcatnloFXFX_stitched_weighted

  DYto2Mu_MLL105_160_Flashsim:
    name: "DY - Flashsim"
    color_mplhep: dodgerblue # red
    processes:
      - DYto2Mu_MLL105To160_Flashsim
      - DYto2Mu_MLL_105to160_amcatnloFXFX_Flashsim_nonStitched
      - DYto2Mu_MLL_105to160_amcatnloFXFX_Flashsim

      - DYto2Mu_MLL105To160_Flashsim_weighted
      - DYto2Mu_MLL105To160_FlashSim_weighted
      - DYto2Mu_MLL_105to160_amcatnloFXFX_Flashsim_nonStitched_weighted
      - DYto2Mu_MLL_105to160_amcatnloFXFX_Flashsim_weighted
      - DYto2Mu_MLL105To160_FlashSim_ptll

  # DYto2Mu_MLL105_160_nonStitched:
  #   name: "DY - non stitched"
  #   color_mplhep: dodgerblue
  #   processes:
  #     - DYto2Mu_MLL105To160_nonStitched
  #     - DYto2Mu_MLL_105to160_amcatnloFXFX_nonStitched

  # DYto2Mu_MLL105_160_VBFFiltered_nonStitched:
  #   name: "DY - MLL(105-160) VBF Fil"
  #   color_mplhep: lightskyblue
  #   processes:
  #     - DYto2Mu_MLL105To160_VBFFiltered
  #     - DYto2Mu_MLL_105to160_amcatnloFXFX_Fil_VBF_nonStitched

  DYto2Mu_MLL105_160_VBFFiltered:
    name: "DY - MLL(105-160) VBF Fil"
    color_mplhep: lightskyblue
    processes:
      - DYto2Mu_MLL105To160_VBFFiltered_weighted
      - DYto2Mu_MLL105To160_VBFFiltered
      - DYto2Mu_MLL_105to160_amcatnloFXFX_Fil_VBF_stitched
      - DYto2Mu_MLL_105to160_amcatnloFXFX_Fil_VBF_stitched_weighted
      - DYto2Mu_MLL_105to160_amcatnloFXFX_Fil_VBF_nonStitched
      - DYto2Mu_MLL105To160_VBFFiltered_ptll

  DYto2Mu_MLL105To160_combined:
    name: "DY - combined"
    color_mplhep: dodgerblue
    processes:
      - DYto2Mu_MLL105To160_combined
      - DYto2Mu_MLL105To160_combined_weighted

  DYto2Mu_Flashsim:
    name: "DY - M50 - Flashsim"
    color_mplhep: dodgerblue
    processes:
      - DYto2Mu_Flashsim

  DYto2L_Flashsim:
    name: "DY - 2L - Flashsim"
    color_mplhep: dodgerblue
    processes:
      - DYto2L_Flashsim

  EWK:
    name: "EWK inclusive"
    color_mplhep: darkorchid
    processes:
      - EWK

  EWK_MLL105_160_herwig:
    name: "EWK - MLL(105-160) - Herwig"
    color_mplhep: darkorchid # red #
    processes:
      - EWK_2Mu2J_MLL_105to160_herwig

  EWK_MLL105_160_pythia:
    name: "EWK - MLL(105-160) - Pythia"
    color_mplhep: dodgerblue
    processes:
      - EWK_2Mu2J_MLL_105to160_pythia

  EWK_MLL105_160_Flashsim:
    name: "EWK - MLL(105-160) - Flashsim"
    color_mplhep: darkorchid # red
    processes:
      - EWK_2Mu2J_MLL_105to160_pythia_Flashsim

  TT:
    name: "t $\\bar{t}$"
    color_mplhep: darkgreen
    processes:
      - TT

  SingleTop:
    name: "Single top"
    color_mplhep: teal
    processes:
      - ST
      - TW

  TTX:
    name: "TT+X"
    color_mplhep: forestgreen
    processes:
      - TTX

  WJets:
    name: "W+jets"
    color_mplhep: lightyellow
    processes:
      - W
      - W_NJets

  SingleH:
    name: "Single H"
    color_mplhep: indigo
    processes:
      - H_mainBckg

  DiTriBoson:
    name: "VV+VVV"
    color_mplhep: tomato
    processes:
      - VV
      - VVV

other_group:
  enabled: true
  key: other
  name: "other"
  color_mplhep: crimson

