# =============================================================================
# JET CONFIGURATION PARAMETERS (FLAF-Independent parameters parsed by Python)
# =============================================================================
jet_pt_min: 25.0
jet_eta_max: 4.7
# Espressione complessa specifica per l'anno 2024 (Tabella Run 3 Run Conditions)
# Nota: 'Jet_p4' è il placeholder che il codice Python sostituirà con 'Jet_p4{suff}'
jet_horn_veto_expr: "( (abs(v_ops::eta(Jet_p4)) >= 2.5 && abs(v_ops::eta(Jet_p4)) < 3.0) && v_ops::pt(Jet_p4) < 50.0 ) || ( (abs(v_ops::eta(Jet_p4)) >= 2.0 && abs(v_ops::eta(Jet_p4)) < 2.5) && v_ops::pt(Jet_p4) < 30.0 )"

# =============================================================================
# SUFFIXES & REGIONS DEFINITIONS
# =============================================================================
default_suffix: _ScaRe_FSR
additional_suffix: ["_noCorr", "_ScaRe", "_scale", "_noCorr_FSR", "_scale_FSR"]
varied_suffix: ["_scale_FSR_up", "_scale_FSR_down", "_resol_FSR_up", "_resol_FSR_down"]
varied_additional_suff: ["_scale_up", "_scale_down", "_resol_up", "_resol_down"]

# Lista aggiuntiva ad uso interno o per documentare le variazioni passive dei Jet
jet_varied_suffix: ["_JERUp", "_JERDown", "_TotalUp", "_TotalDown", "_unCorr"]

masses_regions:
    Z_sideband: "m_mumu{suff} > 70 && m_mumu{suff} < 110"
    Signal_Fit: "m_mumu{suff} > 115 && m_mumu{suff} < 135"
    H_sideband: "((m_mumu{suff} > 110 && m_mumu{suff} < 115) || (m_mumu{suff} > 135 && m_mumu{suff} < 150))"
    Signal_ext: "m_mumu{suff} > 110 && m_mumu{suff} < 150"
    mass_inclusive: "m_mumu{suff} > 60 && m_mumu{suff} < 150"

muon_presel_pt_cut: 15.0
dimuon_m_cut: 50.0

# =============================================================================
# MUONS SELECTION PIPELINE
# =============================================================================
muons_selection:
  muon_pre_sel_check:
    expression: "mu1_pt{suff} > 15 && abs(mu1_eta) < 2.4 && mu2_pt{suff} > 15 && abs(mu2_eta) < 2.4"
    store: True
  muons_OS:
    expression: "mu1_charge * mu2_charge < 0"
    store: True
  muons_OS_and_presel:
    expression: "muon_pre_sel_check && muons_OS"
    store: True
  muons_trigger:
    expression: "( Event_HasTriggerMatching_singleMu && HLT_IsoMu24 && ( ( mu1_pt{suff} > 26 && mu1_HasTriggerMatching_singleMu{suff}) || (mu2_pt{suff} > 26 && mu2_HasTriggerMatching_singleMu{suff}) ) ) "
    store: True
  muons_OS_presel_trg:
    expression: "muons_OS_and_presel && muons_trigger"
    store: True
  mu1_pt_l30:
    expression: "mu1_pt{suff} < 30"
    store: False
  mu2_pt_l30:
    expression: "mu2_pt{suff} < 30"
    store: False
  mu1_pt_g20:
    expression: "mu1_pt{suff} > 20"
    store: False
  mu2_pt_g20:
    expression: "mu2_pt{suff} > 20"
    store: False
  mu_pt_sel:
    expression: "mu1_pt_g20 && mu2_pt_g20"
    store: False
  mu1_ML:
    expression: "mu1_pfIsoId >= 2 && mu1_mediumId"
    store: False
  mu1_LL:
    expression: "mu1_pfIsoId >= 2 && mu1_looseId"
    store: False
  mu1_TT:
    expression: "mu1_pfIsoId >= 4 && mu1_tightId"
    store: False
  mu2_ML:
    expression: "mu2_pfIsoId >= 2 && mu2_mediumId"
    store: False
  mu2_LL:
    expression: "mu2_pfIsoId >= 2 && mu2_looseId"
    store: False
  mu2_TT:
    expression: "mu2_pfIsoId >= 4 && mu2_tightId"
    store: False
  bothMuons_ML:
    expression: "mu1_ML && mu2_ML"
    store: True
  bothMuons_LL:
    expression: "mu1_LL && mu2_LL"
    store: False
  chi2_sel:
    expression: "mu1_bsConstrainedChi2 < 30 && mu2_bsConstrainedChi2 < 30"
    store: True
  pt_lessthan30_and_TT:
    expression: "(((mu1_pt_l30 && mu1_TT) || !(mu1_pt_l30)) && ((mu2_pt_l30 && mu2_TT) || !(mu2_pt_l30)))"
    store: True

# =============================================================================
# JETS SELECTION PIPELINE (Systematics tracking structure)
# =============================================================================
jets_selection:
  # Conta quanti jet passano i requisiti di cross-cleaning e horn veto regionali esterni
  has_good_jets:
    expression: "N_SelectedJets{suff} >= 0"
    store: True
  # JetTagSel controlla passivamente le condizioni sulle soglie loose/medium dei b-tagger
  jets_btag_clean_sel:
    expression: "JetTagSel{suff}"
    store: True


categories:
  base_sel: "muons_OS_presel_trg && && OS_sel && jets_cleanFromMu_sel"
  baseline: "base_sel && mu1_ML && mu2_ML"
  # baseline_thirdLepVeto: "baseline && vetoed_muons==0"
  baseline_chi2: "baseline && chi2_sel"
  baseline_lowPtTT: "(baseline) && (pt_lessthan30_and_TT)"

  # baseline_thirdLepVeto_chi2: "baseline && chi2_sel && vetoed_muons==0"
  # baseline_thirdLepVeto_lowPtTT: "baseline && (pt_lessthan30_and_TT) && vetoed_muons==0"
  baseline_chi2_lowPtTT: "baseline && (pt_lessthan30_and_TT) && chi2_sel"
  # baseline_thirdLepVeto_lowPtTT_chi2: "baseline && (pt_lessthan30_and_TT) && chi2_sel && vetoed_muons==0"

  # j1_outside_horn: "(abs(j1_eta) < 2.5 || abs(j1_eta) > 3 || j1_pt > 50)"
  # j2_outside_horn: "(abs(j2_eta) < 2.5 || abs(j2_eta) > 3 || j2_pt > 50)"
  VBF_def: "HasVBF && j1_pt >= 35 && j2_pt >= 25"

  VBF: "baseline && VBF_def"
  ggF: "baseline && !(VBF_def)"
  # # VBF_thirdLepVeto: "baseline_thirdLepVeto && VBF_def"
  # # ggF_thirdLepVeto: "baseline_thirdLepVeto && !(VBF_def)"
  VBF_chi2: "baseline_chi2 && VBF_def"
  ggF_chi2: "baseline_chi2 && !(VBF_def)"
  VBF_lowPtTT: "baseline_lowPtTT && VBF_def"
  ggF_lowPtTT: "baseline_lowPtTT && !(VBF_def)"
  # # VBF_thirdLepVeto_chi2: "baseline_thirdLepVeto_chi2 && VBF_def"
  # # ggF_thirdLepVeto_chi2: "baseline_thirdLepVeto_chi2 && !(VBF_def)"
  VBF_chi2_lowPtTT: "baseline_chi2_lowPtTT && VBF_def"
  ggF_chi2_lowPtTT: "baseline_chi2_lowPtTT && !(VBF_def)"
  # # VBF_thirdLepVeto_lowPtTT: "baseline_thirdLepVeto_lowPtTT && VBF_def"
  # # ggF_thirdLepVeto_lowPtTT: "baseline_thirdLepVeto_lowPtTT && !(VBF_def)"
  # # VBF_thirdLepVeto_lowPtTT_chi2: "baseline_thirdLepVeto_lowPtTT_chi2 && VBF_def"
  # # ggF_thirdLepVeto_lowPtTT_chi2: "baseline_thirdLepVeto_lowPtTT_chi2 && !(VBF_def)"

