  # mu2_prompt: "(mu2_genPartIdx >= 0 && mu2_gen_kind == 2)"
  # mu1_from_tau: "(mu1_genPartIdx >= 0 && mu1_gen_kind == 4)"
  # mu2_from_tau: "(mu2_genPartIdx >= 0 && mu2_gen_kind == 4)"
