
submit: true
job_flavour: workday

chunk_size: 1        # files per job
max_files: -1        # -1 = all files
use_ext: true     # if true, use all nanoAOD paths in each list; otherwise only the first

output_dirs_by_jerc_2025_mc_mode:
  "2025": /eos/cms/store/group/phys_higgs/cmshmm/vdamante/skim_v2/
  "jec2024_jer2025": /eos/cms/store/group/phys_higgs/cmshmm/vdamante/skim_v2_JER_2025_JEC_2024/
  "2024": /eos/cms/store/group/phys_higgs/cmshmm/vdamante/skim_v2_JER_2024_JEC_2024/
# Legacy fallback for old utilities; keep aligned with the mode in maincfg.yaml.

output_dir: /eos/cms/store/group/phys_higgs/cmshmm/vdamante/skim_v2/

# ---------------------------------------------------------
# condor configuration
# ---------------------------------------------------------

request_cpus: 1
request_memory: 4GB
request_disk: 2GB

# ---------------------------------------------------------
# optional controls
# ---------------------------------------------------------

# run only subset of datasets (optional override)
datasets_whitelist: []
  # - Muon_Run2022C
#   - Muon_Run2022D

# debug mode
dryrun: false


process_to_select:
  - Data_Muon
  - DY
  - DYto2Mu_MLL105To160
  - DYto2Mu_MLL105To160_VBFFiltered
  - DYto2Mu_MLL105To160_FlashSim
  - DYto2Mu_minnlo
  - TT
  - W
  - EWK
  - EWK_2Mu2J_MLL_105to160_herwig
  - EWK_2Mu2J_MLL_105to160_pythia
  - EWK_2Mu2J_MLL_105to160_pythia_Flashsim
  - H_mainBckg
  - VV
  - VH_inclusive
  - VVV
  - ST
  - TW
  - TTX
  - VBFHto2Mu_M125_amcatnlo
  - VBFHto2Mu_m125_Flashsim
  - VBFHto2Mu_M125_powheg
  - VBFHto2Mu_m120
  - VBFHto2Mu_m130
  - VBFHto2Mu_m125_tuneDown
  - VBFHto2Mu_m125_tuneUp
  - GluGluHto2Mu
  - GluGluHto2Mu_tuneDown
  - GluGluHto2Mu_tuneUp
