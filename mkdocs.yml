site_name: H→μμ Analysis Documentation
site_url: https://valeriadamante.github.io/Hmm_newSkim/
repo_url: https://github.com/valeriadamante/Hmm_newSkim
repo_name: valeriadamante/Hmm_newSkim

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - Running:
      - Running instructions: RUNNING_INSTRUCTIONS.md
      - Analysis workflow: ANALYSIS_WORKFLOW.md
      - Skim v3 campaign: SKIM_V3_CAMPAIGN.md
  - Architecture:
      - Script layout: SCRIPT_LAYOUT.md
      - Workflow internals: WORKFLOW.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
